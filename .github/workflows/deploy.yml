name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build.js

      # Publish the built site to the branch GitHub Pages currently serves
      # ("Deploy from a branch" mode). Works without any repo settings change.
      - name: Publish built site to Pages branch
        run: |
          cd dist
          git init -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site built from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site:claude/brave-maxwell-6zvdnk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Modern path: used automatically if Pages source is ever switched to
      # "GitHub Actions" in Settings → Pages. Harmless otherwise.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only succeeds when Pages source = "GitHub Actions"; until then the
    # branch publish above is what serves the site, so don't fail the run.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
